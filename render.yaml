# Blueprint do Render: cria o banco PostgreSQL e o serviço web do NEW GG.
# No painel do Render: New + > Blueprint > selecione o repositório.
databases:
  - name: newgg-db
    databaseName: newgg
    user: newgg
    plan: basic-256mb   # o plano gratuito expira em 30 dias; use um plano pago para produção

services:
  - type: web
    name: newgg
    runtime: node
    plan: starter       # o plano gratuito "dorme" após inatividade e derruba as conexões em tempo real
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: newgg-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      - key: APP_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TENOR_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "50"
