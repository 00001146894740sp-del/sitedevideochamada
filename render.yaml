# Blueprint do Render — versão 100% gratuita.
# Banco: use o Neon gratuito (sem prazo de validade) e cole a URL em DATABASE_URL.
# No painel do Render: New + > Blueprint > selecione o repositório.
services:
  - type: web
    name: newgg
    runtime: node
    plan: free
    region: virginia      # mesma região do banco Neon (us-east) reduz a latência
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      - key: APP_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"       # o Render gratuito bloqueia 465 e 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"         # o banco gratuito tem 1 GB; arquivos menores economizam espaço
