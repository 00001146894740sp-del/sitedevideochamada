<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meu perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   ⚙️  CONFIGURAÇÃO — EDITE AQUI
   Coloque seus arquivos na pasta "assets" (mesma pasta deste index.html)
   ===================================================================== */
const CONFIG = {
  // --- PERFIL ---
  nome:      "seunome",
  usuario:   "@seuuser",
  fotoPerfil:"assets/perfil.png",     // sua foto de perfil
  status:    "dnd",                    // "online" | "idle" | "dnd" | "offline"

  // --- ARQUIVOS ---
  videoFundo:"assets/fundo.mp4",       // vídeo de fundo
  musica:    "assets/musica.mp3",      // música
  tituloMusica: "Nome da Música",
  artistaMusica:"Artista",
  volumeInicial: 0.5,                  // 0 a 1

  // --- DISCORD STATUS (só visual) ---
  discord: {
    nome:  "seunome",
    foto:  "assets/perfil.png",
    textoStatus: "Não perturbe"        // ex: "Online", "Ausente", "Não perturbe"
  },

  // --- ÍCONES/LINKS (aparecem embaixo do nome) ---
  // tipo: "discord" | "instagram" | "tiktok" | "youtube" | "github" | "spotify" | "link"
  links: [
    { tipo: "discord",   url: "https://discord.gg/seuservidor" },
    { tipo: "instagram", url: "https://instagram.com/seuuser" },
    { tipo: "tiktok",    url: "https://tiktok.com/@seuuser" },
  ],

  // --- VISUALIZAÇÕES (número que aparece embaixo) ---
  visualizacoes: 85834,

  // --- LETRA SINCRONIZADA ---
  // "t" = segundo em que a linha começa na música. Coloque a letra da sua música aqui.
  letra: [
    { t: 0,  texto: "♪" },
    { t: 5,  texto: "Primeira linha da letra aqui" },
    { t: 10, texto: "Segunda linha da letra aqui" },
    { t: 15, texto: "Terceira linha da letra aqui" },
    { t: 20, texto: "Quarta linha da letra aqui" },
  ],

  // --- TELA DE ENTRADA ---
  textoEntrada: "clique para entrar",
};
</script>

<style>
  :root{
    --card-bg: rgba(18,18,24,.55);
    --box-bg: rgba(255,255,255,.035);
    --border: rgba(255,255,255,.08);
    --text: #f2f2f5;
    --muted: #8a8a96;
    --accent: #8b7cff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}

  /* ---------- FUNDO ---------- */
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.45) saturate(1.1)}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.75) 100%)}

  /* ---------- TELA DE ENTRADA ---------- */
  #enter{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#000;cursor:pointer;transition:opacity .8s ease}
  #enter span{font-size:15px;letter-spacing:.3em;text-transform:lowercase;color:#cfcfd6;animation:pulse 2s ease-in-out infinite}
  #enter.hide{opacity:0;pointer-events:none}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- CARD ---------- */
  .wrap{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:20px;perspective:1200px}
  .card{width:100%;max-width:530px;background:var(--card-bg);border:1px solid var(--border);border-radius:22px;
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;opacity:0;transform:translateY(20px) scale(.98);
    transition:opacity 1s ease, transform 1s ease}
  .card.show{opacity:1;transform:none}
  .card-inner{padding:26px 24px 16px}

  .head{display:flex;align-items:center;gap:18px}
  .avatar{position:relative;width:96px;height:96px;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:20px;
    box-shadow:0 0 0 2px rgba(190,180,255,.35),0 0 22px rgba(150,130,255,.55),0 0 50px rgba(120,100,255,.25)}
  .status-dot{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;border:4px solid #121218}
  .online{background:#23a55a}.idle{background:#f0b232}.dnd{background:#f23f43}.offline{background:#80848e}

  .name{font-size:26px;font-weight:800;letter-spacing:-.01em}
  .user{font-size:14px;color:var(--muted);margin-top:2px}

  .links{display:flex;gap:10px;margin-top:14px;padding-left:4px}
  .links a{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#7c8cff;
    transition:transform .2s, color .2s, filter .2s}
  .links a:hover{transform:translateY(-2px) scale(1.12);color:#b3a8ff;filter:drop-shadow(0 0 6px #8b7cff)}
  .links svg{width:18px;height:18px}

  .box{margin-top:16px;background:var(--box-bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .label{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:500}
  .label::before{content:"— "}

  .dc{display:flex;align-items:center;gap:12px;margin-top:12px}
  .dc img{width:46px;height:46px;border-radius:50%;object-fit:cover}
  .dc .dcname{font-weight:700;font-size:15px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:999px;
    padding:3px 9px;font-size:11.5px;color:#b9b9c4}
  .pill i{width:6px;height:6px;border-radius:50%}

  .lyric{margin-top:12px;min-height:44px}
  .lyric .cur{font-size:16px;font-weight:700;position:relative;display:inline-block;
    color:rgba(255,255,255,.28);transition:opacity .3s}
  .lyric .cur .fill{position:absolute;left:0;top:0;white-space:nowrap;overflow:hidden;color:#fff;width:0%}
  .lyric .nxt{font-size:13px;color:var(--muted);margin-top:6px;opacity:.7}

  .views{border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px;color:#b9b9c4;font-size:14px;margin-top:16px}
  .views svg{width:16px;height:16px}

  /* ---------- PLAYER ---------- */
  .player{position:fixed;top:10px;right:84px;z-index:10;display:flex;align-items:center;gap:16px;
    background:rgba(14,14,18,.8);border:1px solid var(--border);border-radius:14px;padding:8px 16px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px;
    transition:opacity .35s, transform .35s}
  .player.closed{opacity:0;transform:translateY(-10px);pointer-events:none}
  .player .meta{min-width:90px;line-height:1.25}
  .player .meta b{display:block;font-weight:600;font-size:13px}
  .player .meta span{color:var(--muted)}
  .player .num,.player .time{color:var(--muted);font-variant-numeric:tabular-nums}
  .range{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.15);cursor:pointer;outline:none}
  .range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:none}
  .range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none}
  #seek{width:110px}#vol{width:85px}
  .btn{background:none;border:none;color:#cfcfd6;cursor:pointer;display:flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:50%;transition:background .2s,color .2s}
  .btn:hover{color:#fff;background:rgba(255,255,255,.08)}
  .btn.play{background:rgba(255,255,255,.08);width:32px;height:32px}
  .btn svg{width:14px;height:14px}
  .sep{width:1px;height:20px;background:var(--border)}
  .toggle{position:fixed;top:10px;right:16px;z-index:10;width:50px;height:46px;border-radius:14px;
    background:rgba(14,14,18,.8);border:1px solid var(--border);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
  .toggle i{display:block;width:2.5px;border-radius:2px;background:#fff;height:8px}
  .toggle.playing i{animation:wave 1s ease-in-out infinite}
  .toggle i:nth-child(2){animation-delay:.15s}.toggle i:nth-child(3){animation-delay:.3s}
  .toggle i:nth-child(4){animation-delay:.45s}.toggle i:nth-child(5){animation-delay:.6s}
  @keyframes wave{0%,100%{height:6px}50%{height:20px}}

  @media (max-width:760px){
    .player{right:10px;left:10px;top:64px;flex-wrap:wrap;gap:10px;justify-content:center}
    #seek{width:90px}
    .player .num,.sep,#vol,#volIcon{display:none}
    .avatar{width:78px;height:78px}.name{font-size:22px}
  }
</style>
</head>
<body>

<video id="bg" muted loop playsinline preload="auto"></video>
<div class="vignette"></div>

<div id="enter"><span id="enterText"></span></div>

<!-- PLAYER -->
<div class="player" id="player">
  <div class="meta"><b id="pTitle"></b><span id="pArtist"></span></div>
  <span class="num">1/1</span>
  <span class="time" id="cur">0:00</span>
  <input type="range" class="range" id="seek" min="0" max="1000" value="0">
  <span class="time" id="dur">0:00</span>
  <button class="btn" id="prev" title="Voltar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="btn play" id="playBtn" title="Play/Pause"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
  <button class="btn" id="next" title="Avançar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  <div class="sep"></div>
  <button class="btn" id="volIcon" title="Mudo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9z"/></svg></button>
  <input type="range" class="range" id="vol" min="0" max="100">
  <button class="btn" id="close" title="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<button class="toggle" id="toggle" title="Player"><i></i><i></i><i></i><i></i><i></i></button>

<audio id="audio" loop preload="auto"></audio>

<!-- CARD -->
<div class="wrap">
  <div class="card" id="card">
    <div class="card-inner">
      <div class="head">
        <div class="avatar"><img id="avatar" alt=""><div class="status-dot" id="dot"></div></div>
        <div>
          <div class="name" id="name"></div>
          <div class="user" id="user"></div>
        </div>
      </div>
      <div class="links" id="links"></div>

      <div class="box">
        <div class="label">Discord Status</div>
        <div class="dc">
          <img id="dcImg" alt="">
          <span class="dcname" id="dcName"></span>
          <span class="pill"><i id="dcDot"></i><span id="dcText"></span></span>
        </div>
      </div>

      <div class="box">
        <div class="label">Lyrics</div>
        <div class="lyric">
          <div class="cur" id="lyCur"><span id="lyBase"></span><span class="fill" id="lyFill"></span></div>
          <div class="nxt" id="lyNext"></div>
        </div>
      </div>
    </div>
    <div class="views">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5zm0 11a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"/></svg>
      <span id="views"></span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const C = CONFIG;

/* ---------- ícones das redes ---------- */
const ICONS = {
  discord:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.6 19.6 0 0015.4 3l-.6 1.3a18 18 0 00-5.6 0L8.6 3a19.5 19.5 0 00-4.9 1.4C.6 9 -.3 13.6.1 18.1a19.8 19.8 0 006 3l1.3-2.1a12.8 12.8 0 01-2-1l.5-.4a14 14 0 0012.1 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.7 19.7 0 006-3c.5-5.2-.8-9.7-3.5-13.7zM8.3 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4zm7.4 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 2.3 1.7 3.9 4 4.1v3.1a7 7 0 01-4-1.3v6.2c0 3.8-3.2 6.2-6.4 5.8-3.6-.4-5.6-3.8-4.6-7 .8-2.6 3.4-4.2 6.3-3.8v3.3c-1.4-.4-2.9.3-3.2 1.7-.4 1.6.9 3 2.4 2.9 1.4 0 2.3-1.1 2.3-2.6V3h3.2z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 00-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 001 7.2 31 31 0 00.5 12a31 31 0 00.5 4.8 3 3 0 002.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 002.1-2.1 31 31 0 00.5-4.8 31 31 0 00-.5-4.8zM9.7 15.1V8.9L15.5 12z"/></svg>',
  github:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 00-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 015.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0012 .5z"/></svg>',
  spotify:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a11 11 0 100 22 11 11 0 000-22zm5 15.9a.7.7 0 01-.9.2c-2.6-1.6-5.9-2-9.8-1.1a.7.7 0 11-.3-1.3c4.2-1 7.9-.5 10.8 1.3.3.2.4.6.2.9zm1.3-3a.9.9 0 01-1.2.3c-3-1.8-7.5-2.4-11-1.3a.9.9 0 11-.5-1.7c4-1.2 9-.6 12.4 1.5.4.3.5.8.3 1.2zm.1-3.1C14.8 8.7 8.9 8.5 5.5 9.5a1 1 0 11-.6-2c3.9-1.2 10.4-.9 14.5 1.5a1 1 0 01-1 1.8z"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>',
};
const STATUS_COLOR = {online:"#23a55a",idle:"#f0b232",dnd:"#f23f43",offline:"#80848e"};

/* ---------- preencher dados ---------- */
$("name").textContent = C.nome;
$("user").textContent = C.usuario;
$("avatar").src = C.fotoPerfil;
$("dot").className = "status-dot " + C.status;
$("dcImg").src = C.discord.foto;
$("dcName").textContent = C.discord.nome;
$("dcText").textContent = C.discord.textoStatus;
$("dcDot").style.background = STATUS_COLOR[C.status] || "#80848e";
$("views").textContent = C.visualizacoes.toLocaleString("pt-BR");
$("pTitle").textContent = C.tituloMusica;
$("pArtist").textContent = C.artistaMusica;
$("enterText").textContent = C.textoEntrada;
document.title = C.nome;
$("links").innerHTML = C.links.map(l =>
  `<a href="${l.url}" target="_blank" rel="noopener" title="${l.tipo}">${ICONS[l.tipo]||ICONS.link}</a>`).join("");

const bg = $("bg"), audio = $("audio");
bg.src = C.videoFundo;
audio.src = C.musica;
audio.volume = C.volumeInicial;
$("vol").value = C.volumeInicial * 100;

/* ---------- entrar ---------- */
$("enter").addEventListener("click", () => {
  $("enter").classList.add("hide");
  bg.play().catch(()=>{});
  audio.play().catch(()=>{});
  setTimeout(() => $("card").classList.add("show"), 250);
});

/* ---------- player ---------- */
const fmt = s => isFinite(s) ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>', PLAY = '<path d="M7 4l13 8-13 8z"/>';
function syncBtn(){
  $("playIcon").innerHTML = audio.paused ? PLAY : PAUSE;
  $("toggle").classList.toggle("playing", !audio.paused);
}
audio.addEventListener("play", syncBtn);
audio.addEventListener("pause", syncBtn);
audio.addEventListener("loadedmetadata", () => $("dur").textContent = fmt(audio.duration));
$("playBtn").onclick = () => audio.paused ? audio.play() : audio.pause();
$("prev").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 10);
$("next").onclick = () => audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10);
let seeking = false;
$("seek").addEventListener("input", e => { seeking = true; $("cur").textContent = fmt(e.target.value/1000*audio.duration); });
$("seek").addEventListener("change", e => { audio.currentTime = e.target.value/1000*audio.duration; seeking = false; });
$("vol").addEventListener("input", e => { audio.volume = e.target.value/100; audio.muted = false; });
$("volIcon").onclick = () => { audio.muted = !audio.muted; $("vol").value = audio.muted ? 0 : audio.volume*100; };
$("close").onclick = () => $("player").classList.add("closed");
$("toggle").onclick = () => $("player").classList.toggle("closed");

/* ---------- letra sincronizada (efeito karaokê) ---------- */
let lastIdx = -1;
function tick(){
  const t = audio.currentTime, d = audio.duration || 0;
  if (!seeking && d) { $("seek").value = t/d*1000; $("cur").textContent = fmt(t); }

  const L = C.letra;
  let i = -1;
  for (let k = 0; k < L.length; k++) if (t >= L[k].t) i = k;
  if (i !== lastIdx) {
    lastIdx = i;
    const txt = i >= 0 ? L[i].texto : "";
    $("lyBase").textContent = txt;
    $("lyFill").textContent = txt;
    $("lyNext").textContent = L[i+1] ? L[i+1].texto : "";
  }
  if (i >= 0) {
    const start = L[i].t, end = L[i+1] ? L[i+1].t : (d || start + 5);
    const dur = Math.max(0.5, (end - start) * 0.85);      // preenche em ~85% do tempo da linha
    const p = Math.min(1, (t - start) / dur);
    $("lyFill").style.width = (p*100) + "%";
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- leve inclinação do card com o mouse ---------- */
const card = $("card");
document.addEventListener("mousemove", e => {
  if (!card.classList.contains("show")) return;
  const x = (e.clientX / innerWidth - .5) * 6, y = (e.clientY / innerHeight - .5) * -6;
  card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});
document.addEventListener("mouseleave", () => card.style.transform = "");
</script>
</body>
</html>
