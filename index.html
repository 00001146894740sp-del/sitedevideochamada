<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samuca — Profile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f4f4f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.43) saturate(.7);z-index:-3}#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.35)),rgba(0,0,0,.18);z-index:-2}
.topname{position:absolute;top:17px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:4px;color:#d7d7d7;text-shadow:0 2px 8px #000;white-space:nowrap}
.musicbar{position:absolute;top:16px;right:18px;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #29292d;background:rgba(12,12,14,.8);backdrop-filter:blur(14px);border-radius:15px;box-shadow:0 10px 35px #0005;max-width:min(510px,calc(100vw - 25px))}
.trackcover{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#151515}.trackinfo{min-width:85px;max-width:125px}.trackinfo strong{display:block;font-size:12px;font-weight:650}.trackinfo span{display:block;font-size:10px;color:#9a9a9f;margin-top:2px}.musiccontrols{display:flex;align-items:center;gap:8px}.btn{border:0;background:transparent;color:#ddd;cursor:pointer;padding:4px;display:grid;place-items:center}.btn:hover{color:#fff}.play{width:28px;height:28px;border:1px solid #343438;border-radius:50%;background:#1b1b1e}.progress{width:88px;height:3px;background:#555;border-radius:8px;overflow:hidden;cursor:pointer}.progress i{display:block;width:0;height:100%;background:#f4f4f4}.time{font-size:10px;color:#aaa;white-space:nowrap}.sound{height:27px;display:flex;align-items:center;gap:2px;margin-left:2px}.sound b{width:2px;background:#ccc;border-radius:3px;height:8px;animation:wave .8s ease-in-out infinite alternate}.sound b:nth-child(2){height:16px;animation-delay:.15s}.sound b:nth-child(3){height:21px;animation-delay:.3s}.sound b:nth-child(4){height:12px;animation-delay:.45s}.sound b:nth-child(5){height:17px;animation-delay:.2s}@keyframes wave{to{transform:scaleY(.35)}}.sound.paused b{animation-play-state:paused}
.center{min-height:100%;display:grid;place-items:center;padding:20px}.card{width:min(480px,calc(100vw - 30px));border:1px solid rgba(255,255,255,.11);border-radius:23px;background:rgba(12,12,14,.76);backdrop-filter:blur(20px);box-shadow:0 25px 80px rgba(0,0,0,.48);overflow:hidden;animation:appear .8s ease both}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.profile{display:flex;align-items:center;gap:13px;padding:24px 23px 19px}.avatarwrap{width:86px;height:86px;border-radius:25px;padding:3px;background:linear-gradient(135deg,#7c7c8b,#25252c,#9d9daf);box-shadow:0 0 24px rgba(160,160,180,.2);flex-shrink:0}.avatar{width:100%;height:100%;object-fit:cover;border-radius:22px;background:#080808}.name{font-size:21px;font-weight:750;letter-spacing:-.5px}.handle{font-size:12px;color:#aaa;margin-top:3px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f04c55;margin-right:6px;box-shadow:0 0 10px #f04c5555}.badges{display:flex;gap:7px;margin-top:10px}.badge{font-size:10px;color:#c6c6cc;border:1px solid #35353b;border-radius:7px;padding:4px 7px;background:#19191d}
.section{margin:0 19px 12px;padding:15px;border:1px solid #303035;border-radius:15px;background:rgba(24,24,27,.72)}.label{font-size:10px;letter-spacing:2px;color:#92929b;margin-bottom:12px}.statusrow{display:flex;align-items:center;gap:11px}.miniavatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#111}.statusname{font-size:13px;font-weight:600}.statusdesc{font-size:11px;color:#aaa;margin-top:3px}.pill{font-size:10px;color:#bbb;background:#2a2a2e;border-radius:12px;padding:4px 7px;margin-left:7px}.statusmessage{font-size:13px;color:#dedee2;line-height:1.5}.foot{border-top:1px solid rgba(255,255,255,.07);padding:13px;text-align:center;color:#92929a;font-size:10px;letter-spacing:3px}.foot span{padding:0 7px;color:#c2c2c9}
#enter{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:5;transition:opacity .5s}.enterbtn{font-size:11px;letter-spacing:3px;color:#ddd;background:#111;border:1px solid #34343a;border-radius:13px;padding:15px 22px;cursor:pointer}.enterbtn:hover{background:#1b1b1f}#enter.hidden{opacity:0;pointer-events:none}
@media(max-width:600px){.musicbar{left:10px;right:10px;top:10px;justify-content:space-between;padding:7px 9px}.progress{width:50px}.time{font-size:9px}.center{padding-top:90px;padding-bottom:25px}.card{width:min(430px,calc(100vw - 22px))}.profile{padding:20px 17px}.section{margin-left:13px;margin-right:13px}.avatarwrap{width:72px;height:72px;border-radius:22px}.name{font-size:19px}}
</style>
</head>
<body>
<video id="bg" autoplay muted loop playsinline preload="auto"><source src="assets/spiderman-background.mp4" type="video/mp4"></video><div id="shade"></div>
<div class="topname">@xxsamucaxx0470</div>
<div class="musicbar" aria-label="Player de música"><img class="trackcover" src="assets/avatar.png" alt="Capa"><div class="trackinfo"><strong>Creep</strong><span>Radiohead</span></div><span class="time" id="elapsed">0:00</span><div class="progress" id="seek"><i id="fill"></i></div><span class="time" id="duration">3:56</span><button class="btn play" id="toggle" aria-label="Play ou pause">▶</button><div class="sound paused" id="sound"><b></b><b></b><b></b><b></b><b></b></div></div>
<audio id="audio" preload="metadata"><source src="assets/creep.m4a" type="audio/mp4"></audio>
<main class="center"><article class="card"><div class="profile"><div class="avatarwrap"><img class="avatar" src="assets/avatar.png" alt="Avatar do Samuca"></div><div><div class="name">Samuca</div><div class="handle">@xxsamucaxx0470</div><div class="badges"><span class="badge">PROFILE</span><span class="badge">✦</span></div></div></div>
<section class="section"><div class="label">— PROFILE STATUS</div><div class="statusrow"><img class="miniavatar" src="assets/avatar.png" alt="Avatar"><div><div class="statusname">Samuca <span class="pill">offline</span></div><div class="statusdesc">just vibing.</div></div></div></section>
<section class="section"><div class="label">— NOW PLAYING</div><div class="statusrow"><img class="miniavatar" src="assets/avatar.png" alt="Capa da música"><div><div class="statusname">Creep</div><div class="statusdesc">Radiohead</div></div></div></section>
<div class="foot"><span>✦</span> SAMUCA <span>✦</span></div></article></main>
<div id="enter"><button class="enterbtn" id="start">ENTRAR NO PERFIL</button></div>
<script>
const audio=document.getElementById('audio'),toggle=document.getElementById('toggle'),start=document.getElementById('start'),overlay=document.getElementById('enter'),fill=document.getElementById('fill'),elapsed=document.getElementById('elapsed'),duration=document.getElementById('duration'),sound=document.getElementById('sound'),seek=document.getElementById('seek');
function fmt(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function setPlaying(on){toggle.textContent=on?'❚❚':'▶';sound.classList.toggle('paused',!on)}
start.addEventListener('click',async()=>{overlay.classList.add('hidden');try{await audio.play();setPlaying(true)}catch(e){setPlaying(false)}});
toggle.addEventListener('click',async()=>{if(audio.paused){try{await audio.play();setPlaying(true)}catch(e){setPlaying(false)}}else{audio.pause();setPlaying(false)}});
audio.addEventListener('loadedmetadata',()=>duration.textContent=fmt(audio.duration));audio.addEventListener('timeupdate',()=>{elapsed.textContent=fmt(audio.currentTime);fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%'});audio.addEventListener('ended',()=>setPlaying(false));seek.addEventListener('click',e=>{if(audio.duration){const r=seek.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration}});
</script></body></html>
