<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505"><title>Samuca · @xxsamucaxx0470</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#050505;color:#f5f5f5}body{min-height:100svh;display:grid;place-items:center;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-3;background:#050505}.bg video{width:100%;height:100%;object-fit:cover;filter:brightness(.48) saturate(.8)}.shade{position:fixed;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.72),rgba(0,0,0,.45)),radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,.48) 100%);z-index:-2}
.handle{position:fixed;top:24px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.18em;color:#e4e4e4;opacity:.75;text-transform:lowercase}
.card{width:min(360px,calc(100vw - 36px));border:1px solid rgba(255,255,255,.08);background:rgba(12,12,14,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:19px;padding:20px 18px 14px;box-shadow:0 22px 80px rgba(0,0,0,.5);animation:enter .8s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.head{display:flex;align-items:center;gap:12px;margin-bottom:15px}.avatar{width:58px;height:58px;border-radius:15px;object-fit:cover;background:#090909;border:1px solid rgba(255,255,255,.08)}.name{font-weight:650;font-size:15px}.username{font-size:11px;color:#a4a4a4;margin-top:5px}.dot{width:7px;height:7px;background:#39c878;border-radius:50%;display:inline-block;margin-right:5px;box-shadow:0 0 9px #39c87877}
.panel{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.045);border-radius:12px;padding:12px;margin-top:9px}.label{font-size:9px;color:#818188;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}.songrow{display:flex;align-items:center;gap:10px}.disc{width:38px;height:38px;border-radius:50%;object-fit:cover;animation:spin 8s linear infinite;animation-play-state:paused;border:2px solid #222}.playing .disc{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}.songinfo{min-width:0;flex:1}.track{font-size:12px;font-weight:600}.artist{font-size:10px;color:#a1a1a5;margin-top:3px}.play{width:31px;height:31px;border-radius:50%;border:1px solid #333;background:#1c1c20;color:white;cursor:pointer;font-size:12px}.play:hover{background:#2b2b30}.progress{height:3px;background:#303034;border-radius:10px;margin-top:11px;overflow:hidden}.bar{height:100%;width:0;background:#eee;transition:width .2s linear}.times{display:flex;justify-content:space-between;font-size:9px;color:#777;margin-top:5px}.message{font-size:11px;color:#c6c6c9;line-height:1.5}.footer{font-size:9px;color:#6e6e73;text-align:center;margin-top:15px;letter-spacing:.12em}.start{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:rgba(0,0,0,.62);transition:opacity .5s}.start.hidden{opacity:0;pointer-events:none}.start button{border:1px solid #ffffff35;background:#171719;color:#eee;border-radius:99px;padding:14px 21px;font:500 12px Inter;letter-spacing:.05em;cursor:pointer;box-shadow:0 12px 50px #0008}.start button:hover{background:#222}
@media(max-width:480px){.handle{top:18px;font-size:10px}.card{padding:17px 15px 13px}.avatar{width:54px;height:54px}}
</style></head>
<body>
<div class="bg"><video id="bgvideo" autoplay muted loop playsinline><source src="assets/spiderman-background.mp4" type="video/mp4"></video></div><div class="shade"></div>
<div class="handle">@xxsamucaxx0470</div>
<main class="card" id="profile">
 <div class="head"><img class="avatar" src="assets/avatar.png" alt="Foto de perfil"><div><div class="name">Samuca</div><div class="username"><span class="dot"></span>online</div></div></div>
 <section class="panel"><div class="label">now playing</div><div class="songrow"><img class="disc" src="assets/avatar.png" alt="Capa"><div class="songinfo"><div class="track">Creep</div><div class="artist">Radiohead</div></div><button class="play" id="play" aria-label="Reproduzir música">▶</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div></section>
 <section class="panel"><div class="label">status</div><div class="message">just vibing.</div></section>
 <div class="footer">✦ &nbsp; SAMUCA &nbsp; ✦</div>
</main>
<audio id="music" preload="metadata" loop><source src="assets/creep.m4a" type="audio/mp4"></audio>
<div class="start" id="start"><button id="startBtn">▶ &nbsp; ENTRAR NO PERFIL</button></div>
<script>
const audio=document.getElementById('music'),button=document.getElementById('play'),start=document.getElementById('start'),profile=document.getElementById('profile'),bar=document.getElementById('bar'),cur=document.getElementById('current'),dur=document.getElementById('duration');
function fmt(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function setPlaying(on){profile.classList.toggle('playing',on);button.textContent=on?'Ⅱ':'▶'}
async function play(){try{await audio.play();setPlaying(true);start.classList.add('hidden')}catch(e){setPlaying(false)}}
button.addEventListener('click',()=>audio.paused?play():(audio.pause(),setPlaying(false)));
document.getElementById('startBtn').addEventListener('click',play);
audio.addEventListener('loadedmetadata',()=>dur.textContent=fmt(audio.duration));audio.addEventListener('timeupdate',()=>{cur.textContent=fmt(audio.currentTime);bar.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%'});audio.addEventListener('pause',()=>setPlaying(false));audio.addEventListener('play',()=>setPlaying(true));
</script></body></html>
