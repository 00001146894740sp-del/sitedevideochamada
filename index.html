<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samuca — Profile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#eee;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}
.video-bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.43) saturate(.75);z-index:-3}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.08) 35%,rgba(0,0,0,.5));z-index:-2}
.top-tag{position:fixed;top:22px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:3px;color:#d8d8d8;text-shadow:0 1px 8px #000;white-space:nowrap}
.main{height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(480px,calc(100vw - 28px));border:1px solid rgba(255,255,255,.12);background:rgba(9,9,11,.76);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;box-shadow:0 30px 100px rgba(0,0,0,.55);overflow:hidden;animation:appear .85s ease both}
.profile{display:flex;align-items:center;gap:14px;padding:24px 24px 18px}.avatar{width:78px;height:78px;border-radius:18px;object-fit:cover;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 28px rgba(255,255,255,.08)}
.name{font-size:20px;font-weight:700;letter-spacing:.2px}.handle{font-size:13px;color:#aaa;margin-top:4px}.status{font-size:11px;color:#aaa;margin-top:9px;display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#43d98a;box-shadow:0 0 10px #43d98a}
.panel{margin:0 16px 14px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);border-radius:16px;padding:15px 16px}.label{font-size:9px;color:#888;letter-spacing:2px;margin-bottom:12px}.music-row{display:flex;align-items:center;gap:12px}.disc{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#333,#090909);display:grid;place-items:center;border:1px solid #444;color:#eee;font-size:15px}.song{font-size:14px;font-weight:600}.artist{font-size:11px;color:#999;margin-top:3px}.audio{width:100%;height:34px;margin-top:12px;opacity:.82;filter:grayscale(1)}.caption-box{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);width:min(750px,calc(100% - 30px));text-align:center;pointer-events:none}.lyrics{font-size:clamp(17px,2.8vw,26px);font-weight:600;letter-spacing:.2px;text-shadow:0 2px 15px #000,0 0 28px #000;min-height:35px;opacity:0;transition:opacity .35s}.lyrics.show{opacity:1}.caption-note{margin-top:10px;font-size:10px;color:#aaa;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 10px #000}.footer{padding:0 20px 22px;text-align:center;font-size:10px;letter-spacing:3px;color:#888}
@keyframes appear{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:600px){.profile{padding:20px}.avatar{width:68px;height:68px}.panel{margin:0 12px 12px}.card{border-radius:18px}.caption-box{bottom:18px}.top-tag{top:15px;font-size:10px;letter-spacing:2px}}
</style>
</head>
<body>
<video class="video-bg" autoplay muted loop playsinline><source src="assets/background.mp4" type="video/mp4"></video><div class="shade"></div>
<div class="top-tag">@xxsamucaxx0470</div>
<main class="main"><section class="card">
<div class="profile"><img class="avatar" src="assets/avatar.png" alt="Foto de perfil do Samuca"><div><div class="name">Samuca</div><div class="handle">@xxsamucaxx0470</div><div class="status"><span class="dot"></span> online</div></div></div>
<div class="panel"><div class="label">NOW PLAYING</div><div class="music-row"><div class="disc">♪</div><div><div class="song">Creep</div><div class="artist">Radiohead</div></div></div><audio id="music" class="audio" controls autoplay loop preload="auto"><source src="assets/creep.m4a" type="audio/mp4"></audio></div>
<div class="panel"><div class="label">STATUS</div><div style="font-size:13px;color:#d1d1d1">just vibing.</div></div>
<div class="footer">✦ &nbsp; SAMUCA &nbsp; ✦</div>
</section></main>
<div class="caption-box"><div id="lyric" class="lyrics">But I'm a creep / I'm a weirdo</div><div class="caption-note">♪ Radiohead — Creep ♪</div></div>
<script>
const music=document.getElementById('music'), lyric=document.getElementById('lyric');
// Try autoplay immediately; browsers may require a click to allow audible playback.
const playAttempt=music.play(); if(playAttempt&&playAttempt.catch)playAttempt.catch(()=>{});
// A short permitted lyric excerpt appears around the chorus; otherwise keep a subtle music caption.
function updateCaption(){const t=music.currentTime;const active=t>=48&&t<=65;lyric.classList.toggle('show',active);}
music.addEventListener('timeupdate',updateCaption);music.addEventListener('play',updateCaption);
</script>
</body></html>
