<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoChamada Rápida</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121214; color: #e1e1e6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-bottom: 16px; font-size: 1.5rem; }
    .controls-top { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    input { padding: 10px 14px; border-radius: 6px; border: 1px solid #323238; background: #202024; color: #fff; font-size: 1rem; }
    button { padding: 10px 18px; border-radius: 6px; border: none; background: #8257e5; color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    button:hover { background: #996dff; }
    button.danger { background: #e55757; }
    button.danger:hover { background: #ff6d6d; }
    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; width: 100%; max-width: 1000px; }
    .video-box { position: relative; background: #202024; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; border: 2px solid #29292e; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; }
    .media-bar { display: flex; gap: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>VideoChamada em Tempo Real</h1>

  <div class="controls-top" id="join-panel">
    <input type="text" id="room-input" placeholder="Nome da sala (ex: sala-123)" />
    <button id="join-btn">Entrar na Sala</button>
  </div>

  <div class="videos" id="video-grid">
    <div class="video-box">
      <video id="local-video" autoplay muted playsinline></video>
      <span class="label">Você</span>
    </div>
  </div>

  <div class="media-bar" id="media-bar" style="display: none;">
    <button id="toggle-mic">Mutar Áudio</button>
    <button id="toggle-cam">Desligar Câmera</button>
    <button id="copy-link">Copiar Link da Sala</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const joinBtn = document.getElementById('join-btn');
    const roomInput = document.getElementById('room-input');
    const localVideo = document.getElementById('local-video');
    const videoGrid = document.getElementById('video-grid');
    const mediaBar = document.getElementById('media-bar');

    let localStream;
    const peers = {};

    const iceServers = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('sala')) {
      roomInput.value = urlParams.get('sala');
    }

    joinBtn.addEventListener('click', async () => {
      const roomId = roomInput.value.trim();
      if (!roomId) return alert('Digite o nome da sala.');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;

        document.getElementById('join-panel').style.display = 'none';
        mediaBar.style.display = 'flex';

        const newUrl = `${window.location.pathname}?sala=${encodeURIComponent(roomId)}`;
        window.history.pushState({}, '', newUrl);

        socket.emit('join-room', roomId);
      } catch (err) {
        alert('Erro ao acessar câmera ou microfone: ' + err.message);
      }
    });

    function createPeerConnection(targetId) {
      const pc = new RTCPeerConnection(iceServers);
      peers[targetId] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { target: targetId, candidate: event.candidate });
        }
      };

      pc.ontrack = (event) => {
        let remoteVideo = document.getElementById(`video-${targetId}`);
        if (!remoteVideo) {
          const box = document.createElement('div');
          box.className = 'video-box';
          box.id = `box-${targetId}`;

          remoteVideo = document.createElement('video');
          remoteVideo.id = `video-${targetId}`;
          remoteVideo.autoplay = true;
          remoteVideo.playsinline = true;

          const label = document.createElement('span');
          label.className = 'label';
          label.innerText = 'Participante';

          box.appendChild(remoteVideo);
          box.appendChild(label);
          videoGrid.appendChild(box);
        }
        remoteVideo.srcObject = event.streams[0];
      };

      return pc;
    }

    socket.on('user-connected', async (userId) => {
      const pc = createPeerConnection(userId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('offer', { target: userId, sdp: offer });
    });

    socket.on('offer', async (data) => {
      const pc = createPeerConnection(data.caller);
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('answer', { target: data.caller, sdp: answer });
    });

    socket.on('answer', async (data) => {
      const pc = peers[data.responder];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      }
    });

    socket.on('ice-candidate', async (data) => {
      const pc = peers[data.sender];
      if (pc && data.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('user-disconnected', (userId) => {
      if (peers[userId]) {
        peers[userId].close();
        delete peers[userId];
      }
      const box = document.getElementById(`box-${userId}`);
      if (box) box.remove();
    });

    document.getElementById('toggle-mic').addEventListener('click', (e) => {
      const audioTrack = localStream.getAudioTracks()[0];
      audioTrack.enabled = !audioTrack.enabled;
      e.target.innerText = audioTrack.enabled ? 'Mutar Áudio' : 'Ativar Áudio';
      e.target.classList.toggle('danger', !audioTrack.enabled);
    });

    document.getElementById('toggle-cam').addEventListener('click', (e) => {
      const videoTrack = localStream.getVideoTracks()[0];
      videoTrack.enabled = !videoTrack.enabled;
      e.target.innerText = videoTrack.enabled ? 'Desligar Câmera' : 'Ligar Câmera';
      e.target.classList.toggle('danger', !videoTrack.enabled);
    });

    document.getElementById('copy-link').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      alert('Link da sala copiado! Envie para outra pessoa.');
    });
  </script>
</body>
</html>
