<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoCall - Chamadas por Código</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <!-- Tela inicial: Criar ou Entrar na sala -->
    <section id="lobby" class="lobby-card">
      <h1>VideoCall</h1>
      <p>Crie uma nova sala ou digite o código para entrar.</p>

      <div class="input-group">
        <input type="text" id="roomInput" placeholder="Ex: ABC-123" maxlength="12" />
        <button id="joinBtn" class="btn primary">Entrar na Sala</button>
      </div>

      <div class="divider">ou</div>
      <button id="createBtn" class="btn secondary">Gerar Nova Sala</button>
    </section>

    <!-- Tela da chamada -->
    <section id="callRoom" class="call-room hidden">
      <header class="room-header">
        <span>Código da sala: <strong id="displayRoomCode"></strong></span>
        <button id="copyCodeBtn" class="btn small">Copiar Código</button>
      </header>

      <div class="videos-grid">
        <div class="video-wrapper">
          <video id="localVideo" autoplay muted playsinline></video>
          <span class="label">Você</span>
        </div>
        <div class="video-wrapper">
          <video id="remoteVideo" autoplay playsinline></video>
          <span class="label">Convidado</span>
        </div>
      </div>

      <footer class="controls">
        <button id="toggleMicBtn" class="btn control active">Microfone: Ligado</button>
        <button id="toggleCamBtn" class="btn control active">Câmera: Ligada</button>
        <button id="leaveBtn" class="btn danger">Sair</button>
      </footer>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
